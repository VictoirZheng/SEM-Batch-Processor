# SEM Batch Processor configuration
#
# Settings here can be overridden by config/local.yaml (not tracked by git)
# or by environment variables:
#   SEMBP_MODE        online | local | auto
#   SEMBP_LANG        zh | en
#   SEMBP_MPLUS_PATH  path to the Mplus executable

app:
  # auto: "online" when running on shinyapps.io / Posit Connect, otherwise "local"
  mode: auto
  # default interface language: zh or en (users can switch on the Settings page)
  language: en

# Limits protect a shared server. "local" applies on your own computer.
limits:
  online:
    max_models: 300
    max_bootstrap: 5000
    max_workers: 2
    max_upload_mb: 30
    default_timeout_s: 600
  local:
    max_models: 5000
    max_bootstrap: 20000
    max_workers: 16
    max_upload_mb: 500
    default_timeout_s: 3600

mplus:
  # null = search the PATH and the usual installation folders
  executable_path: null
